<header class="pagina__cabecalho">
  <div>
    <h1>Meus concursos</h1>
    <p>Acompanhe o progresso de cada preparação.</p>
  </div>
  <a mat-flat-button routerLink="/concursos/novo">
    <mat-icon>add</mat-icon>
    Novo concurso
  </a>
</header>

@if (carregando()) {
  <div class="pagina__carregando" role="status" aria-live="polite">
    <mat-spinner diameter="36" />
    <span>Carregando concursos…</span>
  </div>
} @else if (erro(); as mensagem) {
  <app-empty-state icone="error_outline" titulo="Algo deu errado" [descricao]="mensagem">
    <button mat-flat-button type="button" (click)="carregar()">Tentar novamente</button>
  </app-empty-state>
} @else if (concursos().length === 0) {
  <app-empty-state
    icone="workspace_premium"
    titulo="Nenhum concurso por aqui"
    descricao="Crie seu primeiro concurso para montar o cronograma de estudos e acompanhar seu progresso."
  >
    <a mat-flat-button routerLink="/concursos/novo">
      <mat-icon>add</mat-icon>
      Criar concurso
    </a>
  </app-empty-state>
} @else {
  <ul class="grade">
    @for (concurso of concursos(); track concurso.id) {
      <li>
        <app-concurso-card [concurso]="concurso" (editar)="editar($event)" (excluir)="excluir($event)" />
      </li>
    }
  </ul>
}
